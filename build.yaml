targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "bitstorm-labs"
overview: "Downloads TV theme songs and saves them as theme.mp3."
description: >
  Automatically downloads theme songs for TV series from tvthemes.plexapp.com
  and saves them as theme.mp3 in each series folder, so Jellyfin's built-in
  "Play Theme Songs" feature has something to play. Runs nightly as a
  scheduled task and, optionally, as soon as a new series is added. Never
  overwrites an existing theme.mp3, and skips series with no TVDB ID.
category: "Metadata"
artifacts:
  - "Jellyfin.Plugin.ThemeSongs.dll"
